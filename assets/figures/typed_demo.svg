<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">JevRL typed decision demo</title><desc id="desc">Probability bars for choice, score, and abstention.</desc><defs><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#6755e7"/><stop offset="1" stop-color="#9288ff"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop stop-color="#24a57a"/><stop offset="1" stop-color="#72d0ae"/></linearGradient></defs><rect width="1100" height="420" rx="26" fill="#f7f8fc"/><rect x="36" y="32" width="1028" height="76" rx="16" fill="#fff" stroke="#e0e4ef"/><text x="60" y="62" font-family="Arial" font-size="14" font-weight="700" fill="#6f7890">DEMO STATE</text><text x="60" y="91" font-family="Arial" font-size="20" fill="#20283f">A timeout ticket arrives from us-east. What should the agent do?</text><g font-family="Arial"><text x="62" y="157" font-size="14" font-weight="700" fill="#6f7890">CHOICE</text><text x="62" y="183" font-size="22" font-weight="700" fill="#20283f">medium</text><rect x="62" y="204" width="520" height="22" rx="11" fill="#e8eaf2"/><rect x="62" y="204" width="364" height="22" rx="11" fill="url(#g1)"/><text x="595" y="222" font-size="17" fill="#20283f">0.70</text><text x="62" y="253" font-size="14" fill="#7b8499">low 0.08  ·  medium 0.70  ·  high 0.22</text><text x="650" y="157" font-size="14" font-weight="700" fill="#6f7890">SCORE</text><text x="650" y="183" font-size="22" font-weight="700" fill="#20283f">0.74</text><rect x="650" y="204" width="360" height="22" rx="11" fill="#e8eaf2"/><rect x="650" y="204" width="266" height="22" rx="11" fill="url(#g2)"/><text x="1018" y="222" font-size="17" fill="#20283f">74%</text><text x="650" y="253" font-size="14" fill="#7b8499">confidence / urgency score</text><rect x="62" y="304" width="948" height="70" rx="16" fill="#fff" stroke="#e0e4ef"/><text x="86" y="334" font-size="14" font-weight="700" fill="#6f7890">NOUL</text><text x="86" y="359" font-size="18" fill="#20283f">Abstain probability</text><text x="928" y="359" text-anchor="end" font-size="23" font-weight="700" fill="#c66a2a">0.08</text></g></svg>